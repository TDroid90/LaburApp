project_id = "laburapp"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "http://localhost:8081/**",
  "laburapp://auth/callback",
  "laburapp://recover-password",
  "http://localhost:3000/**"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirmá tu cuenta de LaburApp"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "Te invitaron a LaburApp"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Tu enlace para ingresar a LaburApp"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.recovery]
subject = "Recuperá tu contraseña de LaburApp"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirmá tu nuevo correo de LaburApp"
content_path = "./supabase/templates/email-change.html"

[auth.email.template.reauthentication]
subject = "Tu código de seguridad de LaburApp"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Tu contraseña de LaburApp fue actualizada"
content_path = "./supabase/templates/password-changed.html"

[storage]
enabled = true

[functions.delete-account]
verify_jwt = true

[functions.process-account-deletion]
verify_jwt = false
