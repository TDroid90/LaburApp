project_id = "laburapp"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://laburapp-iota.vercel.app"
additional_redirect_urls = [
  "https://laburapp-iota.vercel.app/**",
  "laburapp://auth/callback",
  "http://localhost:3000/**"
]

[auth.email.template.confirmation]
subject = "Confirmá tu cuenta de LaburApp"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Recuperá tu contraseña de LaburApp"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirmá tu nuevo correo de LaburApp"
content_path = "./supabase/templates/email-change.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Tu contraseña de LaburApp fue actualizada"
content_path = "./supabase/templates/password-changed.html"

[storage]
enabled = true
